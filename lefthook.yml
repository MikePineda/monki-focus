# Git hooks, installed by `npm install` through the root "prepare" script.
# Locally the commit message is checked on commit and the privacy gate runs on
# push; the full gate is `npm run verify` and CI (which also runs commitlint
# and gitleaks on every pull request).
prepare-commit-msg:
  jobs:
    # Developer Certificate of Origin: add a Signed-off-by trailer with the
    # local git identity when the message does not carry one yet. Prefer
    # `git commit -s`; this is a safety net, not a substitute for reading the DCO.
    - name: dco-signoff
      run: >-
        git interpret-trailers --in-place --if-exists doNothing
        --trailer "Signed-off-by: $(git config user.name) <$(git config user.email)>" {1}
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no-install commitlint --edit {1}
pre-push:
  jobs:
    # The privacy gate CI also runs, with the maintainer's local pattern file
    # (docs/internal/privacy-patterns.txt, gitignored) when it exists.
    - name: privacy-check
      run: bash scripts/ci/privacy-pre-push.sh
