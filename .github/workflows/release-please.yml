# SPDX-License-Identifier: AGPL-3.0-or-later
#
# release-please in manifest mode (release-please-config.json): one release PR
# per component. Merging a release PR bumps that component's version, writes
# its CHANGELOG.md, tags `<component>-vX.Y.Z` and creates a GitHub Release;
# the jobs below then build, sign, attest and upload the artefacts.
#
# Token: RELEASE_PLEASE_TOKEN (fine-grained PAT, Contents + Pull requests +
# Issues: write), stored in the `release-please` environment (deployments
# from main only), so that release PRs trigger CI and can satisfy the required
# checks. The GITHUB_TOKEN fallback works, but its PRs run no workflows.
#
# Every component releases in two jobs:
#   *-build    `contents: read`, no secrets, no OIDC token. Checks out
#              $GITHUB_SHA, asserts the release tag points at it, builds the
#              unsigned artefact and its SBOM and uploads them as a workflow
#              artifact. Third-party actions (setup-xcode, docker/*, anchore)
#              only ever run here.
#   *-publish  the `release` environment (required reviewer). Runs only
#              first-party actions (actions/*, sigstore/cosign-installer) and
#              preinstalled CLIs: signs (Android keystore lives only here),
#              writes SHA256SUMS, attests build provenance, uploads to the
#              GitHub Release, and for the server pushes, signs (cosign
#              keyless) and attests the image.
# Each pair is a successful no-op while its component does not exist yet.
#
# Outputs used below come from release-please-action: `<path>--release_created`,
# `<path>--tag_name` and `<path>--version`, where <path> is the package key
# in release-please-config.json (`extension`, `android`, `macos`, `server`).
name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mikepineda/monki-focus-server

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-please
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      extension: ${{ steps.release.outputs['extension--release_created'] }}
      extension-tag: ${{ steps.release.outputs['extension--tag_name'] }}
      extension-version: ${{ steps.release.outputs['extension--version'] }}
      android: ${{ steps.release.outputs['android--release_created'] }}
      android-tag: ${{ steps.release.outputs['android--tag_name'] }}
      android-version: ${{ steps.release.outputs['android--version'] }}
      macos: ${{ steps.release.outputs['macos--release_created'] }}
      macos-tag: ${{ steps.release.outputs['macos--tag_name'] }}
      macos-version: ${{ steps.release.outputs['macos--version'] }}
      server: ${{ steps.release.outputs['server--release_created'] }}
      server-tag: ${{ steps.release.outputs['server--tag_name'] }}
      server-version: ${{ steps.release.outputs['server--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # --- extension ------------------------------------------------------------

  release-extension-build:
    name: release-extension-build
    needs: release-please
    if: needs.release-please.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      present: ${{ steps.component.outputs.present }}
    env:
      TAG: ${{ needs.release-please.outputs.extension-tag }}
      VERSION: ${{ needs.release-please.outputs.extension-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - run: bash scripts/ci/assert-release-tag.sh "$TAG"

      - id: component
        run: bash scripts/ci/component-present.sh extension/package.json

      - if: steps.component.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (approved install scripts only)
        if: steps.component.outputs.present == 'true'
        run: |
          bash scripts/ci/require-npm.sh
          npm ci --ignore-scripts
          npm rebuild --strict-allow-scripts

      - name: Build, zip and SBOM
        if: steps.component.outputs.present == 'true'
        run: |
          npm run build -w extension
          npm run zip -w extension
          mkdir -p dist
          zip_file="$(find extension/.output -maxdepth 1 -name '*.zip' ! -name '*-sources.zip' | head -n 1)"
          if [[ -z "$zip_file" ]]; then
            echo '::error::no extension zip found under extension/.output'
            exit 1
          fi
          cp "$zip_file" "dist/monki-focus-extension-${VERSION}.zip"
          npm sbom -w extension --omit dev --sbom-format spdx >"dist/monki-focus-extension-${VERSION}.spdx.json"

      - if: steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release-extension-publish:
    name: release-extension-publish
    needs: [release-please, release-extension-build]
    if: needs.release-extension-build.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.extension-tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-extension
          path: dist

      - name: Checksums
        run: cd dist && sha256sum -- * >SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/monki-focus-extension-*.zip

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # --- android --------------------------------------------------------------

  # Builds the release APK unsigned: the Gradle signingConfig is only applied
  # when ANDROID_KEYSTORE_PATH is set, which never happens in CI.
  release-android-build:
    name: release-android-build
    needs: release-please
    if: needs.release-please.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      present: ${{ steps.component.outputs.present }}
    env:
      TAG: ${{ needs.release-please.outputs.android-tag }}
      VERSION: ${{ needs.release-please.outputs.android-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - run: bash scripts/ci/assert-release-tag.sh "$TAG"

      - id: component
        run: bash scripts/ci/component-present.sh android/settings.gradle.kts android/gradlew

      - if: steps.component.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - if: steps.component.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.component.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: assembleRelease (unsigned)
        if: steps.component.outputs.present == 'true'
        working-directory: android
        run: ./gradlew --no-build-cache --no-configuration-cache assembleRelease

      - name: Collect the unsigned APK
        if: steps.component.outputs.present == 'true'
        run: |
          apk="$(find android -path '*/build/outputs/apk/release/*.apk' | head -n 1)"
          if [[ -z "$apk" ]]; then
            echo '::error::no release APK found'
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/monki-focus-android-${VERSION}-unsigned.apk"

      - if: steps.component.outputs.present == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: android
          format: spdx-json
          output-file: dist/monki-focus-android-${{ needs.release-please.outputs.android-version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - if: steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Signs with apksigner only (no Gradle, no checkout): the keystore exists
  # only in $RUNNER_TEMP of this job and is deleted at the end.
  release-android-publish:
    name: release-android-publish
    needs: [release-please, release-android-build]
    if: needs.release-android-build.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.android-tag }}
      VERSION: ${{ needs.release-please.outputs.android-version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-android
          path: build

      - name: Align, sign (v2 + v3) and verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" ]]; then
            echo '::error::the Android signing secrets are not set in the release environment'
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$keystore")
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          unsigned="build/monki-focus-android-${VERSION}-unsigned.apk"
          aligned="$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          signed="dist/monki-focus-android-${VERSION}.apk"
          "$build_tools/zipalign" -f -P 16 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out "$signed" "$aligned"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed"
          cp build/*.spdx.json dist/

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"

      - name: Checksums
        run: cd dist && sha256sum -- * >SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/monki-focus-android-*.apk

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # --- macos ----------------------------------------------------------------

  # Ad-hoc signature only (no secret involved): notarisation needs an Apple
  # Developer ID (P2).
  release-macos-build:
    name: release-macos-build
    needs: release-please
    if: needs.release-please.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      present: ${{ steps.component.outputs.present }}
    env:
      TAG: ${{ needs.release-please.outputs.macos-tag }}
      VERSION: ${{ needs.release-please.outputs.macos-version }}
      MACOS_SCHEME: MonkiFocus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - run: bash scripts/ci/assert-release-tag.sh "$TAG"

      - id: component
        run: bash scripts/ci/component-present.sh macos/project.yml

      - if: steps.component.outputs.present == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - name: Install XcodeGen (checksum verified)
        if: steps.component.outputs.present == 'true'
        run: bash scripts/ci/install-xcodegen.sh

      - name: Archive, ad-hoc sign, zip and dmg
        if: steps.component.outputs.present == 'true'
        run: |
          (cd macos && xcodegen generate)
          archive="$RUNNER_TEMP/MonkiFocus.xcarchive"
          xcodebuild archive \
            -project macos/MonkiFocus.xcodeproj \
            -scheme "$MACOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          app="$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)"
          if [[ -z "$app" ]]; then
            echo '::error::no .app in the archive'
            exit 1
          fi
          codesign --force --deep --options runtime --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/monki-focus-macos-${VERSION}.zip"
          hdiutil create -volname 'Monki Focus' -srcfolder "$app" -ov -format UDZO \
            "dist/monki-focus-macos-${VERSION}.dmg"

      - if: steps.component.outputs.present == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: macos
          format: spdx-json
          output-file: dist/monki-focus-macos-${{ needs.release-please.outputs.macos-version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - if: steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release-macos-publish:
    name: release-macos-publish
    needs: [release-please, release-macos-build]
    if: needs.release-macos-build.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.macos-tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos
          path: dist

      - name: Checksums
        run: cd dist && sha256sum -- * >SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/monki-focus-macos-*.zip
            dist/monki-focus-macos-*.dmg

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # --- server ---------------------------------------------------------------

  # One native build per architecture, exported as an OCI archive (BuildKit
  # SBOM and max-mode provenance attestations included). Nothing is pushed
  # here, so the job has no registry token.
  release-server-build:
    name: release-server-build (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      present: ${{ steps.component.outputs.present }}
    env:
      TAG: ${{ needs.release-please.outputs.server-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - run: bash scripts/ci/assert-release-tag.sh "$TAG"

      - id: component
        run: bash scripts/ci/component-present.sh Dockerfile

      - if: steps.component.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - if: steps.component.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - if: steps.component.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release-please.outputs.server-version }}
            GIT_SHA=${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/image-${{ matrix.arch }}.tar
          provenance: mode=max
          sbom: true
          no-cache: true

      - if: steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  # Pushes both archives with skopeo (per-arch tags `X.Y.Z-amd64` and
  # `X.Y.Z-arm64`), joins them into the `X.Y.Z`, `X.Y` and `latest` manifest
  # list with `docker buildx imagetools`, then attests and signs the list.
  release-server-publish:
    name: release-server-publish
    needs: [release-please, release-server-build]
    if: needs.release-server-build.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.server-tag }}
      VERSION: ${{ needs.release-please.outputs.server-version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-server-*
          path: images
          merge-multiple: true

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push the images and create the multi-arch manifest list
        id: manifest
        run: |
          sources=()
          for arch in amd64 arm64; do
            skopeo copy --all --preserve-digests \
              "oci-archive:images/image-${arch}.tar" "docker://${IMAGE}:${VERSION}-${arch}"
            sources+=("${IMAGE}:${VERSION}-${arch}")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${VERSION%.*}" -t "${IMAGE}:latest" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{json .SBOM}}' \
            >"monki-focus-server-${VERSION}.sbom.json"
          echo "${IMAGE}@${digest}" >"monki-focus-server-${VERSION}.digest"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity.
      # Verify with `cosign verify` (docs/RUNBOOK.md, CI & releases).
      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Upload the SBOM and digest to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "monki-focus-server-${VERSION}.sbom.json" \
            "monki-focus-server-${VERSION}.digest" --clobber --repo "$GITHUB_REPOSITORY"
