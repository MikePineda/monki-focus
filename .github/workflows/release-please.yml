# SPDX-License-Identifier: AGPL-3.0-or-later
#
# release-please in manifest mode (release-please-config.json): one release PR
# per component. Merging a release PR bumps that component's version, writes
# its CHANGELOG.md, tags `<component>-vX.Y.Z` and creates a GitHub Release;
# the matching job below then builds, signs, attests and uploads the artefacts.
#
# Token: RELEASE_PLEASE_TOKEN (fine-grained PAT, Contents + Pull requests +
# Issues: write) so that release PRs trigger CI and can satisfy the required
# checks; the GITHUB_TOKEN fallback works but its PRs run no workflows.
#
# Security (docs/threat-model.md, CI/release): actions pinned by SHA, no
# default permissions, artefact jobs run in the `release` environment (with a
# required reviewer), build caches are not restored in release jobs, every
# artefact gets an SBOM and a build-provenance attestation, and the server
# image is signed with cosign keyless. Each job is a successful no-op while
# its component does not exist yet.
#
# Outputs used below come from release-please-action: `<path>--release_created`,
# `<path>--tag_name` and `<path>--version`, where <path> is the package key
# in release-please-config.json (`extension`, `android`, `macos`, `server`).
name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mikepineda/monki-focus-server

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      extension: ${{ steps.release.outputs['extension--release_created'] }}
      extension-tag: ${{ steps.release.outputs['extension--tag_name'] }}
      extension-version: ${{ steps.release.outputs['extension--version'] }}
      android: ${{ steps.release.outputs['android--release_created'] }}
      android-tag: ${{ steps.release.outputs['android--tag_name'] }}
      android-version: ${{ steps.release.outputs['android--version'] }}
      macos: ${{ steps.release.outputs['macos--release_created'] }}
      macos-tag: ${{ steps.release.outputs['macos--tag_name'] }}
      macos-version: ${{ steps.release.outputs['macos--version'] }}
      server: ${{ steps.release.outputs['server--release_created'] }}
      server-tag: ${{ steps.release.outputs['server--tag_name'] }}
      server-version: ${{ steps.release.outputs['server--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-extension:
    name: release-extension
    needs: release-please
    if: needs.release-please.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.extension-tag }}
      VERSION: ${{ needs.release-please.outputs.extension-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.extension-tag }}
          persist-credentials: false

      - id: component
        run: bash scripts/ci/component-present.sh extension/package.json

      - if: steps.component.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies (approved install scripts only)
        if: steps.component.outputs.present == 'true'
        run: npm ci --ignore-scripts && npm rebuild --strict-allow-scripts

      - name: Build and zip
        if: steps.component.outputs.present == 'true'
        run: |
          npm run build -w extension
          npm run zip -w extension
          mkdir -p dist
          zip_file="$(find extension/.output -maxdepth 1 -name '*.zip' ! -name '*-sources.zip' | head -n 1)"
          if [[ -z "$zip_file" ]]; then
            echo '::error::no extension zip found under extension/.output'
            exit 1
          fi
          cp "$zip_file" "dist/monki-focus-extension-${VERSION}.zip"
          npm sbom -w extension --omit dev --sbom-format spdx >"dist/monki-focus-extension-${VERSION}.spdx.json"
          (cd dist && sha256sum -- * >SHA256SUMS)

      - if: steps.component.outputs.present == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/monki-focus-extension-*.zip

      - name: Upload to the GitHub Release
        if: steps.component.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  release-android:
    name: release-android
    needs: release-please
    if: needs.release-please.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.android-tag }}
      VERSION: ${{ needs.release-please.outputs.android-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.android-tag }}
          persist-credentials: false

      - id: component
        run: bash scripts/ci/component-present.sh android/settings.gradle.kts android/gradlew

      - if: steps.component.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - if: steps.component.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.component.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # The keystore only ever exists in $RUNNER_TEMP and is removed at the
      # end. The Gradle signingConfig reads ANDROID_KEYSTORE_PATH and the
      # three secrets from the environment (docs/RUNBOOK.md, CI & releases).
      - name: Decode the release keystore
        if: steps.component.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo '::error::ANDROID_KEYSTORE_BASE64 is not set in the release environment'
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$keystore")
          echo "ANDROID_KEYSTORE_PATH=$keystore" >>"$GITHUB_ENV"

      - name: assembleRelease
        if: steps.component.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-build-cache --no-configuration-cache assembleRelease

      - name: Verify the signature and collect the APK
        if: steps.component.outputs.present == 'true'
        run: |
          apk="$(find android -path '*/build/outputs/apk/release/*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          if [[ -z "$apk" ]]; then
            echo '::error::no signed release APK found'
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/monki-focus-android-${VERSION}.apk"

      - if: steps.component.outputs.present == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: android
          format: spdx-json
          output-file: dist/monki-focus-android-${{ needs.release-please.outputs.android-version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        if: steps.component.outputs.present == 'true'
        run: cd dist && sha256sum -- * >SHA256SUMS

      - if: steps.component.outputs.present == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/monki-focus-android-*.apk

      - name: Upload to the GitHub Release
        if: steps.component.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  release-macos:
    name: release-macos
    needs: release-please
    if: needs.release-please.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.macos-tag }}
      VERSION: ${{ needs.release-please.outputs.macos-version }}
      MACOS_SCHEME: MonkiFocus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.macos-tag }}
          persist-credentials: false

      - id: component
        run: bash scripts/ci/component-present.sh macos/project.yml

      - if: steps.component.outputs.present == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      # Ad-hoc signature only: notarisation needs an Apple Developer ID (P2).
      - name: Archive, ad-hoc sign, zip and dmg
        if: steps.component.outputs.present == 'true'
        run: |
          brew install xcodegen
          (cd macos && xcodegen generate)
          archive="$RUNNER_TEMP/MonkiFocus.xcarchive"
          xcodebuild archive \
            -project macos/MonkiFocus.xcodeproj \
            -scheme "$MACOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          app="$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)"
          if [[ -z "$app" ]]; then
            echo '::error::no .app in the archive'
            exit 1
          fi
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/monki-focus-macos-${VERSION}.zip"
          hdiutil create -volname 'Monki Focus' -srcfolder "$app" -ov -format UDZO \
            "dist/monki-focus-macos-${VERSION}.dmg"

      - if: steps.component.outputs.present == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: macos
          format: spdx-json
          output-file: dist/monki-focus-macos-${{ needs.release-please.outputs.macos-version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        if: steps.component.outputs.present == 'true'
        run: cd dist && shasum -a 256 -- * >SHA256SUMS

      - if: steps.component.outputs.present == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/monki-focus-macos-*.zip
            dist/monki-focus-macos-*.dmg

      - name: Upload to the GitHub Release
        if: steps.component.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Multi-arch image built natively per architecture, pushed by digest, then
  # joined into one manifest list (release-server-publish).
  release-server-build:
    name: release-server-build (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      present: ${{ steps.component.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.server-tag }}
          persist-credentials: false

      - id: component
        run: bash scripts/ci/component-present.sh Dockerfile

      - if: steps.component.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - if: steps.component.outputs.present == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - if: steps.component.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.component.outputs.present == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release-please.outputs.server-version }}
            GIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export the digest
        if: steps.component.outputs.present == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - if: steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release-server-publish:
    name: release-server-publish
    needs: [release-please, release-server-build]
    if: needs.release-server-build.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.server-tag }}
      VERSION: ${{ needs.release-please.outputs.server-version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server-version }}
            type=raw,value=latest

      - name: Create the multi-arch manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest_file in *; do sources+=("${IMAGE}@sha256:${digest_file}"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: monki-focus-server-${{ needs.release-please.outputs.server-version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is bound to this workflow's OIDC identity.
      # Verify with `cosign verify` (docs/RUNBOOK.md, CI & releases).
      - name: Sign the image and attach the SBOM (cosign keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson \
            --predicate "monki-focus-server-${VERSION}.spdx.json" "${IMAGE}@${DIGEST}"

      - name: Upload the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          echo "${IMAGE}@${DIGEST}" >"monki-focus-server-${VERSION}.digest"
          gh release upload "$TAG" "monki-focus-server-${VERSION}.spdx.json" \
            "monki-focus-server-${VERSION}.digest" --clobber --repo "$GITHUB_REPOSITORY"
