# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CI guards merges; it never deploys or publishes.
#
# `changes` decides which component jobs run (paths filter). Every component
# job also checks that its component exists yet (scripts/ci/component-present.sh)
# and becomes a successful no-op when it does not, so pull requests pass while
# the monorepo is still being scaffolded.
#
# The ruleset requires one quality check, the `ci` aggregator: it runs always,
# fails when a needed job failed or was cancelled and passes when jobs were
# skipped by the paths filter. This avoids the "required check that never runs
# blocks the PR forever" trap of path-filtered workflows. `commitlint` and
# `gitleaks` live in their own workflows and are required too.
#
# Security (docs/threat-model.md, CI/release): every action is pinned by full
# commit SHA, the default token has no permissions, each job asks for the
# minimum, no `pull_request_target`, and `npm ci --ignore-scripts` followed by
# `npm rebuild --strict-allow-scripts` so only install scripts approved in the
# root package.json (`allowScripts`) ever run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NG_CLI_ANALYTICS: 'false'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.filter.outputs.node_any }}
      server: ${{ steps.filter.outputs.server }}
      android: ${{ steps.filter.outputs.android_any }}
      macos: ${{ steps.filter.outputs.macos_any }}
      docker: ${{ steps.filter.outputs.docker_any }}
      e2e: ${{ steps.filter.outputs.e2e_any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Shared TS packages are consumed by every client: Android and macOS
          # read packages/rules and packages/protocol fixtures by relative path.
          filters: |
            rules: &rules
              - 'packages/rules/**'
            engine: &engine
              - 'packages/engine/**'
            protocol: &protocol
              - 'packages/protocol/**'
            tokens: &tokens
              - 'packages/design-tokens/**'
            server: &server
              - 'server/**'
              - 'Dockerfile'
              - 'docker/**'
            extension: &extension
              - 'extension/**'
            android: &android
              - 'android/**'
            macos: &macos
              - 'macos/**'
            root: &root
              - 'package*.json'
              - 'turbo.json'
              - '.nvmrc'
              - '.prettier*'
              - 'tsconfig*.json'
              - '.github/**'
              - 'scripts/**'
            workflow: &workflow
              - '.github/workflows/ci.yml'
              - 'scripts/ci/**'
            node_any:
              - *rules
              - *engine
              - *protocol
              - *tokens
              - *server
              - *extension
              - *root
            android_any:
              - *android
              - *rules
              - *protocol
              - *workflow
            macos_any:
              - *macos
              - *rules
              - *protocol
              - *workflow
            docker_any:
              - *server
              - *rules
              - *engine
              - *protocol
              - 'package*.json'
              - *workflow
            e2e_any:
              - *server
              - *extension
              - *rules
              - *engine
              - *protocol
              - *root

  node:
    name: node
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      # Always started: this job runs every workspace's tests (turbo, no
      # filter), and the server suite needs Postgres even when only a shared
      # package such as packages/protocol changed.
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: monkifocus
          POSTGRES_PASSWORD: monkifocus
          POSTGRES_DB: monkifocus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monkifocus -d monkifocus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: monkifocus
      DB_PASSWORD: monkifocus
      DB_DATABASE: monkifocus_test
      NTFY_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm >= 11.19.0 (allowScripts policy)
        run: bash scripts/ci/require-npm.sh

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Run the install scripts approved in package.json allowScripts
        run: npm rebuild --strict-allow-scripts

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # A service container cannot override the image command (`ntfy serve`),
      # so ntfy is started by hand, and only when the server changed.
      - name: Start ntfy
        if: needs.changes.outputs.server == 'true'
        run: |
          docker run -d --name ntfy -p 8080:80 \
            binwiederhier/ntfy:v2.33.1@sha256:29bc952294d58957f6ca6638eca9a653a33555989224edbdf4bb9433ee606497 serve
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/v1/health && exit 0
            sleep 1
          done
          echo '::error::ntfy did not become healthy'
          exit 1

      # The device-API contract diff (Adonis routes vs packages/protocol
      # openapi.yaml) and the Tuyau codegen diff join this job with WP S1.
      - name: Lint, typecheck, test, build
        run: npx --no-install turbo run lint typecheck test build --continue

      - name: npm audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: bash scripts/ci/require-npm.sh

      - run: npm ci --ignore-scripts

      - name: Prettier
        run: npx --no-install prettier --check .

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: component
        working-directory: .
        run: bash scripts/ci/component-present.sh android/settings.gradle.kts android/gradlew

      - if: steps.component.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - if: steps.component.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.component.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Spotless + ktlint instead of detekt (plan decision). Unit tests run on
      # the JVM, Robolectric only for wiring.
      - name: Spotless, lint, unit tests, debug build
        if: steps.component.outputs.present == 'true'
        run: ./gradlew spotlessCheck lintDebug testDebugUnitTest assembleDebug --continue

      - name: Upload test and lint reports
        if: failure() && steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7

  # Non-blocking until it proves stable (emulators are flaky on shared
  # runners); not part of the `ci` aggregator.
  android-instrumented:
    name: android-instrumented
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: component
        run: bash scripts/ci/component-present.sh android/settings.gradle.kts android/app/src/androidTest

      - if: steps.component.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - if: steps.component.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - if: steps.component.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        if: steps.component.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an emulator
        if: steps.component.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest

  macos:
    name: macos
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    # macos-26 (arm64) is GA in actions/runner-images with Xcode 26.x
    # installed (26.6 default); macos-15 would be the fallback.
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      MACOS_SCHEME: MonkiFocus
      CORE_PACKAGE: macos/Packages/MonkiCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: component
        run: bash scripts/ci/component-present.sh macos/project.yml

      - id: core
        run: bash scripts/ci/component-present.sh macos/Packages/MonkiCore/Package.swift

      - if: steps.component.outputs.present == 'true' || steps.core.outputs.present == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - if: steps.core.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            macos/Packages/MonkiCore/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('macos/**/Package.resolved', 'macos/**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: swift-format lint
        if: steps.component.outputs.present == 'true' || steps.core.outputs.present == 'true'
        run: |
          strict=()
          [[ -f macos/.swift-format ]] && strict=(--strict)
          xcrun swift-format lint --recursive "${strict[@]}" macos

      - name: MonkiCore tests
        if: steps.core.outputs.present == 'true'
        run: swift test --package-path "$CORE_PACKAGE"

      - name: Install XcodeGen (checksum verified)
        if: steps.component.outputs.present == 'true'
        run: bash scripts/ci/install-xcodegen.sh

      - name: Generate the Xcode project and run the app tests
        if: steps.component.outputs.present == 'true'
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild test \
            -scheme "$MACOS_SCHEME" \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=-

      # The Debug helper takes its socket from MONKI_BRIDGE_SOCKET_PATH (for
      # the end-to-end tests); a Release helper must not even contain the name.
      - name: Release monki-bridge has no test-only socket override
        if: steps.component.outputs.present == 'true'
        working-directory: macos
        run: |
          xcodebuild build \
            -scheme "$MACOS_SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/release" \
            CODE_SIGN_IDENTITY=-
          helper="$RUNNER_TEMP/release/Build/Products/Release/MonkiFocus.app/Contents/Helpers/monki-bridge"
          test -x "$helper"
          if strings "$helper" | grep -q MONKI_BRIDGE_SOCKET_PATH; then
            echo "the Release monki-bridge still reads MONKI_BRIDGE_SOCKET_PATH" >&2
            exit 1
          fi

  docker:
    name: docker
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    # Production runs on ARM64; build there natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: component
        run: bash scripts/ci/component-present.sh Dockerfile

      - if: steps.component.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      # Build only, no push: a broken Dockerfile fails here, not in the deploy.
      - name: docker build --target runtime
        if: steps.component.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=docker-arm64
          cache-to: type=gha,mode=max,scope=docker-arm64

  # Non-blocking until it proves stable; not part of the `ci` aggregator.
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: component
        run: bash scripts/ci/component-present.sh e2e/package.json e2e/playwright.config.ts

      - if: steps.component.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.component.outputs.present == 'true'
        run: |
          bash scripts/ci/require-npm.sh
          npm ci --ignore-scripts
          npm rebuild --strict-allow-scripts

      - name: Install Playwright Chromium
        if: steps.component.outputs.present == 'true'
        working-directory: e2e
        run: npx --no-install playwright install --with-deps chromium

      - name: E2E
        if: steps.component.outputs.present == 'true'
        run: npx --no-install turbo run e2e

      - name: Upload Playwright report
        if: failure() && steps.component.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  privacy:
    name: privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test of the guard scripts (synthetic patterns only)
        run: bash scripts/ci/self-test.sh

      # The patterns live only in the PRIVACY_PATTERNS secret (one ERE per
      # line). Fork pull requests and a missing secret get the generic
      # e-mail and phone checks plus a warning.
      - name: No personal details in tracked files or paths
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: bash scripts/ci/privacy-check.sh

  no-node-text-logging:
    name: no-node-text-logging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Android never logs accessibility node text
        run: bash scripts/ci/check-android-logging.sh

  # The single required quality check (see the header).
  ci:
    name: ci
    if: always()
    needs:
      - changes
      - node
      - format
      - android
      - macos
      - docker
      - privacy
      - no-node-text-logging
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The paths filter reads the PR file list from the API, which stops at
      # 3000 files; beyond that the skipped jobs could be wrong.
      - name: Pull request is small enough for the paths filter
        if: github.event_name == 'pull_request'
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if (( CHANGED_FILES > 3000 )); then
            echo "::error::${CHANGED_FILES} changed files; the paths filter only sees 3000. Split the pull request."
            exit 1
          fi

      - name: Fail on failed or cancelled jobs, pass on skipped ones
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')"
          if [[ -n "$bad" ]]; then
            echo "::error::failed or cancelled: $bad"
            exit 1
          fi
