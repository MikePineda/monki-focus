#
# Required check `commitlint`: every commit of the pull request follows
# Conventional Commits with a DCO `Signed-off-by:` trailer
# (commitlint.config.mjs). The pull request title is linted too, because a
# squash merge turns it into the commit release-please reads.
name: commitlint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint every commit of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # The title alone carries no trailer: the squash commit gets the
      # sign-offs from the commit bodies, so only `trailer-exists` is relaxed.
      # Dependabot titles are sentence-case by design and are skipped.
      - name: Lint the pull request title
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          cat > .commitlint-title.config.mjs <<'EOF'
          import base from './commitlint.config.mjs'
          export default { ...base, rules: { ...base.rules, 'trailer-exists': [0] } }
          EOF
          printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --config .commitlint-title.config.mjs --verbose
