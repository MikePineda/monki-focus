# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Required check `commitlint`: every commit of the pull request follows
# Conventional Commits with a DCO `Signed-off-by:` trailer
# (commitlint.config.mjs). `main` accepts rebase merges only, so these commits
# land as written and are what release-please reads. The pull request title
# never becomes a commit; it is linted to keep titles in the same format, and
# for Dependabot, whose commits are not linted, it is the only check.
name: commitlint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: bash scripts/ci/require-npm.sh

      - run: npm ci --ignore-scripts

      - name: Specification of the commitlint configs
        run: bash scripts/ci/commitlint-test.sh

      # Dependabot commits carry no DCO sign-off and a generated body; their
      # PR title (`build(deps): Bump …`) is still linted below.
      - name: Lint every commit of the pull request
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # A title has no trailers (commitlint.title.config.mjs). Only pull requests
      # opened by Dependabot may also capitalise the subject
      # (commitlint.dependabot.config.mjs); everything else keeps the full rules.
      - name: Lint the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          config=commitlint.title.config.mjs
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' ]]; then
            config=commitlint.dependabot.config.mjs
          fi
          printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --config "$config" --verbose
