# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Required check `gitleaks`: no secrets in the commits of a pull request, and
# none in the whole history on main. Uses the repo's .gitleaks.toml (default
# rules plus the published test-vector allowlist), read from the base commit
# on pull requests.
#
# The gitleaks release binary is downloaded and verified against a pinned
# SHA-256 instead of using gitleaks-action, which needs a license key for
# organisations and is one more third-party action with repo access.
name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >>"$GITHUB_PATH"

      - name: Scan the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The config comes from the base commit, so a pull request cannot
        # allowlist its own leak by editing .gitleaks.toml.
        run: |
          config="$RUNNER_TEMP/gitleaks.toml"
          if git cat-file -e "${BASE_SHA}:.gitleaks.toml" 2>/dev/null; then
            git show "${BASE_SHA}:.gitleaks.toml" >"$config"
            config_args=(--config "$config")
          else
            echo '::notice::No .gitleaks.toml on the base commit; using the default rules.'
            config_args=()
          fi
          gitleaks git "${config_args[@]}" --redact --verbose --no-banner \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .
