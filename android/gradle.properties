# App version, owned by release-please (component `android`). The trailing
# annotation is stripped by build-logic (MonkiVersion); keep it on this line.
VERSION_NAME=0.0.0 # x-release-please-version

org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# packages/rules ships schema/v1 (work package 2.1), so the
# :core-domain wiring test also requires the schema directory.
monki.rules.expectSchemaV1=true
